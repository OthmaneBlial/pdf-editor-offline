<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">A PDF workstation on your own computer</title>
  <desc id="desc">An original illustration of a local computer, an input PDF and a separate saved copy. Document processing runs locally; recovery copies can also remain on disk.</desc>
  <rect width="960" height="320" rx="24" fill="#063e32"/>
  <path d="M0 270h960" stroke="#38574b" stroke-width="2"/>
  <g fill="#faf6ea" font-family="'Trebuchet MS', sans-serif">
    <text x="38" y="48" font-size="14" font-weight="700" letter-spacing="2">NO UPLOAD REQUIRED</text>
    <text x="38" y="94" font-family="Georgia, serif" font-size="35">Your own PDF desk.</text>
    <text x="39" y="131" font-size="20" fill="#cad7c7">Read, edit and save locally.</text>
  </g>
  <g transform="translate(39 177)">
    <rect width="75" height="90" rx="7" fill="#cad7c7"/>
    <path d="M18 25h39M18 41h28M18 57h34" stroke="#063e32" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="39" fill="#faf6ea" font-family="'Trebuchet MS', sans-serif" font-size="22">Your original</text>
    <text x="92" y="66" fill="#cad7c7" font-family="'Trebuchet MS', sans-serif" font-size="17">stays where it is.</text>
  </g>
  <g transform="translate(459 71)">
