    <path d="M19 30h61M19 50h45M19 70h58" stroke="#063e32" stroke-width="5" stroke-linecap="round"/>
    <path d="m21 111 11-12 10 11 19-20 18 19" fill="none" stroke="#ad5b2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="m854 64 15-15 18 18-15 15-59 59-24 6 6-24Z" fill="#063e32"/>
