name: Verify PDF Editor Offline evidence
description: Validate a content-free PDF Editor Offline JSON report against an immutable v1 schema.

inputs:
  report:
    description: Path to the JSON report generated by a stable PDF Editor Offline CLI command.
    required: true
  schema:
    description: Filename from trust_lab/schemas/v1/index.json.
    required: true

outputs:
  valid:
    description: Always true when the action completes successfully.
    value: ${{ steps.validate.outputs.valid }}
  report_schema:
    description: Stable schema identifier declared by the report.
    value: ${{ steps.validate.outputs.report_schema }}
  report_schema_version:
    description: Stable schema version declared by the report.
    value: ${{ steps.validate.outputs.report_schema_version }}

runs:
  using: composite
  steps:
    - name: Set up validation runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install pinned validator
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
    - name: Validate content-free evidence
      id: validate
      shell: bash
      env:
        PDF_EVIDENCE_REPORT: ${{ inputs.report }}
        PDF_EVIDENCE_SCHEMA: ${{ inputs.schema }}
        PDF_EVIDENCE_SCHEMA_ROOT: ${{ github.action_path }}/../../../trust_lab/schemas/v1
      run: >-
        python "${{ github.action_path }}/verify_report.py"
        --report "$PDF_EVIDENCE_REPORT"
        --schema "$PDF_EVIDENCE_SCHEMA"
        --schema-root "$PDF_EVIDENCE_SCHEMA_ROOT"
        --github-output "$GITHUB_OUTPUT"
        --step-summary "$GITHUB_STEP_SUMMARY"
