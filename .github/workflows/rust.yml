name: Native Rust

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'apps/**'
      - 'deny.toml'
      - '.github/workflows/rust.yml'
      - 'tools/**'
      - 'distribution/npm/**'
      - 'vendor/**'
      - 'tests/fixtures/**'
  pull_request:
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'apps/**'
      - 'deny.toml'
      - '.github/workflows/rust.yml'
      - 'tools/**'
      - 'distribution/npm/**'
      - 'vendor/**'
      - 'tests/fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and native build libraries
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p pdf-worker --all-targets --features test-helper --locked -- -D warnings
      - name: Rust tests and API documentation
        run: |
          cargo build -p pdf-worker -p pdf-editor-offline-native -p pdf-editor-offline-cli --features pdf-worker/test-helper --locked
          cargo test --workspace --locked
          cargo test --release -p pdf-core --test text_decode --locked
          cargo test -p pdf-worker --features test-helper --locked
          cargo test -p pdf-editor-offline-native --locked -- --include-ignored --skip production_native_worker_multiline_undo_save_and_independent_reference --skip production_native_merge_and_saved_copy_pass_independent_text_pixels_geometry_checks --skip production_native_overlay_worker_save_and_independent_pixels --skip production_native_notes_preserve_page_content_pixels_metadata_and_verified_new_copy --skip production_native_child_matches_independent_decrypt_geometry_and_text_without_password_arguments --skip production_native_split_saved_chunks_pass_independent_text_pixels_geometry_checks --skip production_native_vector_worker_and_independent_saved_pixels --skip production_native_image_worker_save_history_and_independent_pixels --skip content_edit_production_native_child_independent_reader_pixels --skip production_native_visual_signature_worker_and_independent_saved_pixels --skip production_native_numbering_child_undo_redo_and_save --skip production_native_image_replacement_child_and_independent_readers --skip production_native_proportional_width_change_is_durable_and_source_bound --skip production_native_property_transaction_is_durable_and_source_bound --skip production_native_self_host_redaction_copy_and_verified_save --skip production_native_font_face_transaction_is_durable_and_source_bound --skip production_native_chosen_font_unicode_kerning_and_saved_output --skip production_native_self_host_image_removal_saved_copy_matches_independent_controls
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: Audit locked dependencies and licenses
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo audit --file Cargo.lock
          cargo deny check licenses sources
      - name: Independent PDF output and measured CLI baseline
        run: |
          sudo apt-get install --yes --no-install-recommends build-essential cmake pkg-config curl unzip xz-utils gnupg libfreetype-dev libfontconfig1-dev zlib1g-dev libbrotli-dev libharfbuzz-dev libjpeg-dev liblcms2-dev poppler-data
          bash tools/reference/install_reference_poppler.sh "$RUNNER_TEMP/reference-poppler"
          bash tools/reference/install_reference_qpdf.sh "$RUNNER_TEMP/reference-qpdf"
          cargo build --release -p pdf-editor-offline-cli --locked --message-format=json > "$RUNNER_TEMP/native-cli-build.json"
          cargo build --release -p native-evidence --locked
          target/release/native-evidence --binary target/release/pdf-editor-offline --build-artifact-json "$RUNNER_TEMP/native-cli-build.json" --reference-bin-dir "$RUNNER_TEMP/reference-poppler/bin" --qpdf "$RUNNER_TEMP/reference-qpdf/bin/qpdf" --output "$RUNNER_TEMP/rust-baseline.json"
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test native_pages_reference -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test notes -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-render --test annotations -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" PDF_REFERENCE_QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" cargo test --locked -p pdf-editor-offline-cli --test metadata -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" PDF_REFERENCE_QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" cargo test --locked -p pdf-editor-offline-cli --test note_updates -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" cargo test --locked -p pdf-convert --test images -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" PDF_REFERENCE_QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" cargo test --locked -p pdf-editor-offline-cli --test images -- --ignored
          PATH="$RUNNER_TEMP/reference-poppler/bin:$PATH" cargo test --locked -p pdf-core --test merge -- --ignored
          PDF_FORM_QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_FORM_POPPLER_BIN="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test forms -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test forms -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test text_forms -- --ignored
          PDF_FORM_QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_FORM_POPPLER_BIN="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test cff_forms -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test text_forms -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test choice_forms -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test choice_forms -- --ignored
          PDF_SANITIZE_QPDF="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_SANITIZE_POPPLER_BIN="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test sanitize -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test multiline_forms -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_worker_multiline_undo_save_and_independent_reference -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_merge_and_saved_copy_pass_independent_text_pixels_geometry_checks -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-render --test attachment_icons -- --ignored
          PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-render --test text_icons -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test text_overlay -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_overlay_worker_save_and_independent_pixels -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_notes_preserve_page_content_pixels_metadata_and_verified_new_copy -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_child_matches_independent_decrypt_geometry_and_text_without_password_arguments -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_split_saved_chunks_pass_independent_text_pixels_geometry_checks -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test split -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test vector_overlay -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_vector_worker_and_independent_saved_pixels -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_visual_signature_worker_and_independent_saved_pixels -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test page_numbering -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_numbering_child_undo_redo_and_save -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-convert --test overlay -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test image_overlay -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test image_instances -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-cli --test image_overlay -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_image_worker_save_history_and_independent_pixels -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test content_edit -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test redaction -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test redaction_state -- --include-ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-core --test image_redaction -- --include-ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_self_host_image_removal_saved_copy_matches_independent_controls -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_self_host_redaction_copy_and_verified_save -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_font_face_transaction_is_durable_and_source_bound -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_chosen_font_unicode_kerning_and_saved_output -- --ignored
          PDF_QPDF_BIN="$RUNNER_TEMP/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="$RUNNER_TEMP/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native content_edit_production_native_child_independent_reader_pixels -- --ignored
          PDF_QPDF_BIN="${{ runner.temp }}/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="${{ runner.temp }}/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_image_replacement_child_and_independent_readers -- --ignored
          PDF_QPDF_BIN="${{ runner.temp }}/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="${{ runner.temp }}/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_proportional_width_change_is_durable_and_source_bound -- --ignored
          PDF_QPDF_BIN="${{ runner.temp }}/reference-qpdf/bin/qpdf" PDF_REFERENCE_BIN_DIR="${{ runner.temp }}/reference-poppler/bin" cargo test --locked -p pdf-editor-offline-native production_native_property_transaction_is_durable_and_source_bound -- --ignored
      - name: Preserve independent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-independent-baseline
          path: |
            ${{ runner.temp }}/rust-baseline.json
            ${{ runner.temp }}/native-cli-build.json
          if-no-files-found: warn

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb
      - name: Cross-platform tests and desktop build
        shell: bash
        run: |
          cargo build -p pdf-worker -p pdf-editor-offline-native -p pdf-editor-offline-cli --features pdf-worker/test-helper --locked
          cargo test --workspace --locked
          cargo test -p pdf-worker --features test-helper --locked
          cargo test -p pdf-editor-offline-native --locked -- --include-ignored --skip production_native_worker_multiline_undo_save_and_independent_reference --skip production_native_merge_and_saved_copy_pass_independent_text_pixels_geometry_checks --skip production_native_overlay_worker_save_and_independent_pixels --skip production_native_notes_preserve_page_content_pixels_metadata_and_verified_new_copy --skip production_native_child_matches_independent_decrypt_geometry_and_text_without_password_arguments --skip production_native_split_saved_chunks_pass_independent_text_pixels_geometry_checks --skip production_native_vector_worker_and_independent_saved_pixels --skip production_native_image_worker_save_history_and_independent_pixels --skip content_edit_production_native_child_independent_reader_pixels --skip production_native_visual_signature_worker_and_independent_saved_pixels --skip production_native_numbering_child_undo_redo_and_save --skip production_native_image_replacement_child_and_independent_readers --skip production_native_proportional_width_change_is_durable_and_source_bound --skip production_native_property_transaction_is_durable_and_source_bound --skip production_native_self_host_redaction_copy_and_verified_save --skip production_native_font_face_transaction_is_durable_and_source_bound --skip production_native_chosen_font_unicode_kerning_and_saved_output --skip production_native_self_host_image_removal_saved_copy_matches_independent_controls
      - name: Test npm installer with the actual native CLI on Node 22
        shell: bash
        run: PDF_NATIVE_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/pdf-editor-offline${{ runner.os == 'Windows' && '.exe' || '' }}" node --test distribution/npm/tests/*.test.mjs
      - name: Linux desktop startup smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/pdf-native-xvfb.XXXXXX")
          Xvfb -displayfd 3 -screen 0 1280x800x24 -nolisten tcp 3> "$smoke_dir/display" > "$RUNNER_TEMP/xvfb-startup.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT
          for _attempt in {1..100}; do
            if test -s "$smoke_dir/display"; then break; fi
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if ! test -s "$smoke_dir/display"; then
            cat "$RUNNER_TEMP/xvfb-startup.log"
            exit 1
          fi
          display=$(cat "$smoke_dir/display")
          if [[ ! "$display" =~ ^[0-9]+$ ]]; then exit 1; fi
          set +e
          DISPLAY=":$display" timeout 10s target/debug/pdf-editor-offline-native > "$RUNNER_TEMP/native-startup.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-startup.log"
          test "$result" -eq 124

