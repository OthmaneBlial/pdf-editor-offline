name: Signed desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: signed-desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release identity and signing credentials
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag, source version, and checked-out commit
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(python desktop/scripts/release_assets.py verify-tag --tag "$RELEASE_TAG")"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          source_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$source_commit" ]]; then
            echo "The checked-out source does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fail closed when production credentials are absent
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          required=(
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD
            WINDOWS_CERTIFICATE_THUMBPRINT WINDOWS_TIMESTAMP_URL
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.platform }} signed clean-install proof
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            sidecar: src-tauri/resources/sidecar/pdf-editor-offline-api.exe
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar: src-tauri/resources/sidecar/pdf-editor-offline-api
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            sidecar: src-tauri/resources/sidecar/pdf-editor-offline-api
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            sidecar: src-tauri/resources/sidecar/pdf-editor-offline-api
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - name: Install native Linux packaging dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev libfuse2 libgtk-3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf xdg-utils xvfb
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Install locked JavaScript dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix desktop ci
      - name: Build native frozen sidecar
        run: npm --prefix desktop run build:sidecar -- --target "${{ matrix.target }}"
      - name: Smoke frozen sidecar
        run: >-
          npm --prefix desktop run smoke:sidecar --
          --sidecar "${{ matrix.sidecar }}"
          --sample ../examples/sample_pdfs/demo-redaction.pdf
      - name: Import macOS Developer ID certificate
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/pdf-editor-offline-release.p12"
          keychain="$RUNNER_TEMP/pdf-editor-offline-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | \
            grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null
      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "pdf-editor-offline-release.pfx"
          [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
              -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          $expected = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          if ($certificate.Thumbprint.ToUpperInvariant() -ne $expected) {
              throw "Imported Windows certificate thumbprint does not match configuration"
          }
          if (-not $certificate.HasPrivateKey -or $certificate.NotAfter -le (Get-Date)) {
              throw "Windows code-signing certificate is unusable or expired"
          }
          if (-not $env:WINDOWS_TIMESTAMP_URL.StartsWith("https://")) {
              throw "WINDOWS_TIMESTAMP_URL must use HTTPS"
          }
          $config = @{
              bundle = @{
                  windows = @{
                      certificateThumbprint = $expected
                      digestAlgorithm = "sha256"
                      timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                  }
              }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content `
              -Path (Join-Path $env:RUNNER_TEMP "tauri-windows-release.json") `
              -Encoding utf8
      - name: Build signed and notarized macOS bundles
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npm --prefix desktop run build --
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
      - name: Build signed Windows bundle
        if: matrix.platform == 'windows-x64'
        run: >-
          npm --prefix desktop run build --
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --config "$RUNNER_TEMP/tauri-windows-release.json"
      - name: Build Linux bundles
        if: matrix.platform == 'linux-x64'
        run: >-
          npm --prefix desktop run build --
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
      - name: Collect stable release assets
        run: >-
          python desktop/scripts/release_assets.py collect
          --bundle-root "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          --output "desktop/dist/release/${{ matrix.platform }}"
          --platform "${{ matrix.platform }}"
      - name: Verify signed and notarized macOS install
        if: startsWith(matrix.platform, 'macos-')
        run: >-
          bash desktop/scripts/smoke-installed-macos.sh
          "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          --require-notarized
      - name: Verify signed Windows install
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: >-
          ./desktop/scripts/smoke-installed-windows.ps1
          -AssetDirectory "desktop/dist/release/${{ matrix.platform }}"
          -RequireTrustedSignature
      - name: Verify Linux install
        if: matrix.platform == 'linux-x64'
        run: >-
          bash desktop/scripts/smoke-installed-linux.sh
          "desktop/dist/release/${{ matrix.platform }}"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: desktop/src-tauri/resources/sidecar
          format: cyclonedx-json
          output-file: desktop/dist/release/${{ matrix.platform }}/sbom-${{ matrix.platform }}.cdx.json
          upload-artifact: false
      - name: Generate signed build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.1
        with:
          subject-path: desktop/dist/release/${{ matrix.platform }}/PDF-Editor-Offline-*
      - name: Preserve offline Sigstore provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          DESTINATION: desktop/dist/release/${{ matrix.platform }}/provenance-${{ matrix.platform }}.sigstore.json
        run: python -c "import os, shutil; shutil.copy2(os.environ['BUNDLE_PATH'], os.environ['DESTINATION'])"
      - name: Upload signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-desktop-${{ matrix.platform }}
          path: desktop/dist/release/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove Windows signing certificate
        if: always() && matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $thumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "")
          $certificate = Get-Item "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          if ($certificate) {
              Remove-Item $certificate.PSPath -Force
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP "pdf-editor-offline-release.pfx") `
              -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP "tauri-windows-release.json") `
              -Force -ErrorAction SilentlyContinue
      - name: Remove temporary macOS keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pdf-editor-offline-release.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/pdf-editor-offline-release.p12"

  trust-lab:
    name: Publish cross-engine Trust Lab evidence
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Trust Lab runtime
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run versioned three-engine corpus
        run: >-
          python scripts/run_trust_lab.py
          --release "${{ needs.preflight.outputs.version }}"
          --results release/trust-lab
          --dashboard release/trust-lab.html
      - name: Bundle immutable schema v1
        run: tar -czf release/trust-lab-schemas-v1.tar.gz -C trust_lab/schemas v1
      - name: Upload release Trust Lab evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trust-lab-release
          path: release
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify complete set and publish GitHub Release
    needs: [preflight, build, trust-lab]
    runs-on: ubuntu-22.04
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download all signed platform evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: signed-desktop-*
          path: release
          merge-multiple: true
      - name: Download Trust Lab release evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: trust-lab-release
          path: release
      - name: Verify hashes, versions, SBOMs, provenance, and asset completeness
        run: >-
          python desktop/scripts/release_assets.py verify-set
          --root release
          --version "${{ needs.preflight.outputs.version }}"
      - name: Verify published GitHub provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release/PDF-Editor-Offline-*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Require human-authored release notes
        run: >-
          test -s "docs/releases/${{ needs.preflight.outputs.version }}.md"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release/PDF-Editor-Offline-* \
            release/SHA256SUMS \
            release/release-manifest.json \
            release/sbom-*.cdx.json \
            release/provenance-*.sigstore.json \
            release/trust-lab.html \
            "release/trust-lab/$RELEASE_VERSION.json" \
            release/trust-lab-schemas-v1.tar.gz \
            --verify-tag \
            --title "PDF Editor Offline $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md"
