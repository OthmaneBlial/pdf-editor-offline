name: Rust security scanning

on:
  push:
    branches: [main]
    paths: ['Cargo.*', 'apps/**', 'crates/**', 'tools/**', 'vendor/**', '.github/**']
  pull_request:
    branches: [main]
    paths: ['Cargo.*', 'apps/**', 'crates/**', 'tools/**', 'vendor/**', '.github/**']
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: rust-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:${{ matrix.language }}
