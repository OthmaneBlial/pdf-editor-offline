name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python-core:
    name: Python ${{ matrix.python-version }} without optional binaries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run capability-aware test suite
        run: python -m pytest -q --disable-warnings --maxfail=1

  python-full:
    name: Python with LibreOffice, Tesseract, and Ghostscript
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghostscript libreoffice tesseract-ocr
      - name: Install Python project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run full suite with coverage
        run: python -m pytest -q --cov=api --cov=pdf_editor_offline --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Report coverage by subsystem
        run: |
          coverage report --include='pdf_editor_offline/core/*' --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report --include='api/*' --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend quality gates (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --coverage
      - name: Production build
        run: npm run build
      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  desktop:
    name: Tauri and Rust source gates
    runs-on: ubuntu-24.04
    env:
      # Source-only checks do not execute or package the Python sidecar.
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Check desktop source build
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked

  e2e:
    name: Upload, edit, export, and reopen E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev,e2e]'
          python -m playwright install --with-deps chromium
          npm --prefix frontend ci
      - name: Run browser workflow
        run: tests/run_frontend_smoke.sh

  dependency-audit:
    name: Python and Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit installed Python dependency graph
        run: |
          python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'
          python -m pip install --disable-pip-version-check -e . pip-audit==2.10.1
          pip-audit --skip-editable
      - name: Install Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependency graph
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  package:
    name: Python package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          twine check dist/*
      - name: Test wheel installation
        run: |
          python -m pip install dist/*.whl
          pdf-editor-offline --help

  docker:
    name: Docker smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag pdf-editor-offline:ci .
      - name: Verify CLI
        run: docker run --rm pdf-editor-offline:ci pdf-editor-offline --help

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
