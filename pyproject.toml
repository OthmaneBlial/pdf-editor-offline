[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-editor-offline"
version = "3.0.0"
description = "Free local-first PDF editing, signing, conversion, redaction, and privacy cleanup"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Othmane BLIAL"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Utilities"
]
keywords = [
    "pdf editor",
    "free pdf editor",
    "pdf editor offline",
    "offline pdf editor",
    "pymupdf",
    "cli",
    "pdf manipulation",
    "pdf redaction",
    "pdf conversion",
    "document automation",
    "api",
]
dependencies = [
    "PyMuPDF",
    "pymupdf-fonts==1.0.5",
    "Pillow",
    "typer",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pdf2docx",
    "python-pptx",
    "pdfplumber",
    "pypdfium2",
    "cryptography",
    "pyHanko==0.36.2",
    "pandas",
    "numpy",
    "openpyxl",
    "pytesseract",
    "python-dotenv",
    "typing_extensions",
    "markdown",
    "reportlab",
    "ebooklib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "jsonschema>=4.23,<5",
]
e2e = [
    "playwright>=1.52,<2",
]

[project.urls]
Homepage = "https://github.com/OthmaneBlial/pdf-editor-offline"
Repository = "https://github.com/OthmaneBlial/pdf-editor-offline"
Issues = "https://github.com/OthmaneBlial/pdf-editor-offline/issues"
Changelog = "https://github.com/OthmaneBlial/pdf-editor-offline/blob/main/CHANGELOG.md"

[project.scripts]
pdf-editor-offline = "pdf_editor_offline.cli.main:app"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pdf_editor_offline*"]
exclude = ["pdf_editor_offline.tests*"]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
