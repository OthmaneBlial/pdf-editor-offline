[package]
name = "pdf-editor-offline-desktop"
version = "3.0.0"
description = "Desktop shell for PDF Editor Offline"
authors = ["Othmane BLIAL"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "pdf_editor_offline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdf-editor-offline-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
portpicker = "0.1.1"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
uuid = { version = "1.18", features = ["v4"] }
