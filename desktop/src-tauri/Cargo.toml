[package]
name = "pdf-editor-offline-desktop"
version = "2.0.1"
description = "Desktop shell for PDF Editor Offline"
authors = ["Othmane BLIAL"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdf_editor_offline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdf-editor-offline-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
portpicker = "0.1.1"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-shell = "2.3.5"
