[package]
name = "pdf-editor-offline-native"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Othmane BLIAL"]
description = "Native offline PDF viewer and page rotation editor"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "0.15.4"
pdf-core = { path = "../../crates/pdf-core" }
pdf-render = { path = "../../crates/pdf-render" }
pdf-convert = { path = "../../crates/pdf-convert" }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
lopdf = { version = "0.45.0", default-features = false }
tempfile = "3.27"
