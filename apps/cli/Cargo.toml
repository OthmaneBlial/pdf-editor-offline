[package]
name = "pdf-editor-offline-cli"
description = "Independent native PDF Editor Offline command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "pdf-editor-offline"
path = "src/main.rs"

[dependencies]
pdf-core = { path = "../../crates/pdf-core" }
pdf-convert = { path = "../../crates/pdf-convert" }
pdf-render = { path = "../../crates/pdf-render" }
png = "=0.18.1"
tempfile.workspace = true
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde_json.workspace = true

[dev-dependencies]
lopdf.workspace = true

[lints]
workspace = true
