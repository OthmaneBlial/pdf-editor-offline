      <path d="M122 0V34C122 38.418 125.582 42 130 42H164L122 0Z" fill="#CBD5E1"/>
      <rect x="28" y="66" width="102" height="10" rx="5" fill="#FD4F3F"/>
      <rect x="28" y="88" width="84" height="8" rx="4" fill="#64748B"/>
