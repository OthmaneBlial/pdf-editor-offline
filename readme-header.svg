      <rect x="2" y="124" width="196" height="8" rx="4" fill="url(#accent)"/>
      <text x="2" y="150" fill="#111827" font-family="Verdana, Geneva, sans-serif" font-size="10" font-weight="700">No accounts. No uploads. Files stay local.</text>
