      <text x="2" y="60" fill="#475569" font-family="Verdana, Geneva, sans-serif" font-size="12" font-weight="500">Edit, convert, protect, clean locally.</text>
      <rect x="2" y="84" width="66" height="28" rx="7" fill="#FFF1ED" stroke="#FEB2A8"/>
