[package]
name = "pdf-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "=0.11.1"
pdf-core = { path = "../pdf-core" }
pdf-render = { path = "../pdf-render" }
pdf-convert = { path = "../pdf-convert" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process", "fs", "mm"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true
lopdf.workspace = true

[features]
test-helper = []

[[bin]]
name = "pdf-editor-offline-worker"
path = "src/main.rs"

[[bin]]
name = "pdf-worker-test-helper"
path = "tests/support/helper.rs"
required-features = ["test-helper"]

# Only audited native limit/observation and journal-privacy adapters permit unsafe FFI.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
