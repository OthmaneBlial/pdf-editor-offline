[workspace]
members = ["crates/pdf-core", "crates/pdf-render", "crates/pdf-convert", "crates/pdf-worker", "apps/cli", "apps/desktop", "tools/native-evidence"]
resolver = "3"

[workspace.package]
version = "4.0.0-preview.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Othmane BLIAL"]
repository = "https://github.com/OthmaneBlial/pdf-editor-offline"

[workspace.dependencies]
lopdf = { version = "0.45.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }

